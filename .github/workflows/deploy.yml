name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      SITE_URL: https://saichriszhang.github.io
      SITE_BASE: /
    steps:
      - name: Check out website
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install locked dependencies
        run: npm ci
      - name: Test document publication safeguards
        run: npm run test:publish-docs
      - name: Check Astro
        run: npm run check
      - name: Build selected public content
        run: npm run build
      - name: Verify routes and PDFs
        run: npm run verify
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
